name: test

on:
  pull_request:
  push:
    branches:
      - main
      - gavel-v2-voter-model

permissions:
  contents: read

jobs:
  node:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]
    # The governance-index role and permission tests need a real server: they
    # assert on effective PostgreSQL privileges, which no stub can model. Without
    # this service they skip, and the deployment gates go unverified in CI.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: gavel-ci-only
          POSTGRES_DB: gavel_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - name: Create disposable Gate database
        env:
          PGPASSWORD: gavel-ci-only
        run: createdb -h 127.0.0.1 -U postgres gavel_gate_ci_disposable
      - name: Attest isolated Gate and governance test databases
        shell: bash
        env:
          PGPASSWORD: gavel-ci-only
          PG_SERVICE_ID: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail
          test -n "$PG_SERVICE_ID"
          # Prove that the published TCP port and service container are one cluster.
          cluster_id="$(psql -h 127.0.0.1 -U postgres -d gavel_ci -At -c 'SELECT system_identifier FROM pg_control_system()')"
          test "$cluster_id" = "$(docker exec "$PG_SERVICE_ID" psql -U postgres -d gavel_ci -At -c 'SELECT system_identifier FROM pg_control_system()')"
          nonce="$(openssl rand -hex 16)"
          createdb -h 127.0.0.1 -U postgres gavel_test_ci_disposable
          psql -h 127.0.0.1 -U postgres -d gavel_test_ci_disposable -v ON_ERROR_STOP=1 \
            -c "COMMENT ON DATABASE gavel_test_ci_disposable IS 'gavel-disposable:${nonce}'" >/dev/null
          psql -h 127.0.0.1 -U postgres -d gavel_gate_ci_disposable -v ON_ERROR_STOP=1 \
            -c "COMMENT ON DATABASE gavel_gate_ci_disposable IS 'gavel-disposable:${nonce}'" >/dev/null
          docker exec "$PG_SERVICE_ID" sh -c 'printf %s "$1" > "$PGDATA/gavel-disposable-cluster.attestation"' attest "$nonce"
          {
            echo "GAVEL_TEST_DATABASE_NONCE=$nonce"
            echo "GAVEL_TEST_CLUSTER_ID=$cluster_id"
            echo "GAVEL_TEST_DISPOSABLE_OPT_IN=I_UNDERSTAND_DISPOSABLE_DB"
          } >> "$GITHUB_ENV"
      - name: PostgreSQL 16 Gate integration (zero skips)
        shell: bash
        env:
          GAVEL_GATE_TEST_DATABASE_URL: postgres://postgres:gavel-ci-only@127.0.0.1:5432/gavel_gate_ci_disposable
          GAVEL_GATE_TEST_DATABASE_DISPOSABLE: yes
        run: |
          set +e
          output="$(node --test --test-concurrency=1 \
            packages/server/test/gate-store-postgres.test.js \
            packages/server/test/gate-reservation-lifecycle-postgres.test.js \
            packages/server/test/durable-persistence.test.js \
            packages/server/test/auth-session-environment.test.js 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$output"
          if [ "$status" -ne 0 ] || grep -Eq '# skipped [1-9]|# SKIP' <<<"$output"; then
            echo "Gate PostgreSQL integration failed or skipped" >&2
            exit 1
          fi
      - run: npm test
        env:
          GAVEL_TEST_DISPOSABLE_OPT_IN: I_UNDERSTAND_DISPOSABLE_DB
          GAVEL_TEST_DATABASE_URL: postgresql://postgres:gavel-ci-only@127.0.0.1:5432/gavel_test_ci_disposable
      - run: npm test --workspace @gavel/cli
      - run: npm run tui:typecheck
      # Gavel Web (apps/web) is a separate workspace with its own Vitest suite,
      # so the root Node test run does not cover it. Type-check and build it
      # too: a broken CommonJS interop or Rollup config fails only at build
      # time. Production builds refuse to run without explicit API origins;
      # the build-check script proves that refusal and a valid build.
      - run: npm test --workspace @gavel/web
      - run: npm run typecheck --workspace @gavel/web
      - run: scripts/web-build-check.sh

